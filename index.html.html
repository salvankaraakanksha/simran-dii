<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Simran Dii</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --ph:min(calc(100vh - 190px),calc(94vw / 1.4142),1000px);
  --ph:min(calc(100dvh - 190px),calc(94vw / 1.4142),1000px);
  --pw:calc(var(--ph) * .7071);
  --ink:#3b2616; --paper:#f6ead2; --wine:#8a1c2b; --kraft:#b88b5c;
  --hand:'Caveat','Bradley Hand','Segoe Script',cursive;
  --type:'Special Elite','Courier New',monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background-color:var(--kraft);
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .18 0 0 0 0 .08 0 0 0 .55 -.12'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='700'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='.006 .012' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .98 0 0 0 0 .86 0 0 0 0 .66 0 0 0 .6 -.22'/></filter><rect width='100%25' height='100%25' filter='url(%23m)'/></svg>"),
    radial-gradient(ellipse at 50% 45%,rgba(255,235,190,.35),rgba(60,30,10,.45) 100%);
  font-family:var(--type);color:var(--ink);overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:2600px}
#book{position:relative;width:calc(var(--pw) * 2);height:var(--ph);transform:translateX(-25%);transition:transform 1s cubic-bezier(.5,0,.2,1)}
#book.open{transform:translateX(0)}
.page,.face{position:absolute;overflow:hidden;border-radius:3px}
.page{left:50%;top:0;width:50%;height:100%;box-shadow:0 14px 34px rgba(40,20,5,.45),0 2px 4px rgba(40,20,5,.3)}
.page>img.bg,.face>img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.page::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,rgba(30,12,0,.32),rgba(30,12,0,0) 7%)}
#flipper{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.55,0,.25,1)}
#book.open #flipper{transform:rotateY(-180deg)}
.face{inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 34px rgba(40,20,5,.45),0 2px 4px rgba(40,20,5,.3)}
#cover{cursor:pointer;outline-offset:6px}
#cover::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,rgba(30,12,0,.3),rgba(30,12,0,0) 6%)}
#letterPage{transform:rotateY(180deg)}
#letterPage::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to left,rgba(30,12,0,.32),rgba(30,12,0,0) 7%)}
#letterHit{position:absolute;left:12.8%;top:18%;width:64%;height:64%;cursor:pointer;background:none;border:0;z-index:2;border-radius:4px}
#letterHit:focus-visible,#cover:focus-visible{outline:3px dashed var(--wine)}
#letterHint{position:absolute;left:14%;top:12.2%;font:700 calc(var(--pw) * .052)/1 var(--hand);color:var(--wine);transform:rotate(-4deg);pointer-events:none;z-index:3;transition:opacity .3s;text-shadow:0 0 6px #f6ead2,0 0 3px #f6ead2}
#letterHint.gone{opacity:0}
/* flames */
.flame{position:absolute;pointer-events:none;will-change:transform}
.flame img{width:100%;height:100%;display:block}
.smoke{position:absolute;width:7%;aspect-ratio:1;margin:-3.5% 0 0 -3.5%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(110,90,80,.5),rgba(110,90,80,0) 70%);animation:smoke 1.6s ease-out forwards}
@keyframes smoke{from{opacity:.9;transform:translate(0,0) scale(.5)}to{opacity:0;transform:translate(calc(var(--pw) * .06),calc(var(--pw) * -.2)) scale(2.4)}}
#wish{position:absolute;left:8%;right:8%;top:44%;padding:calc(var(--pw) * .04) calc(var(--pw) * .03) calc(var(--pw) * .04);text-align:center;background:#f8eed8;color:var(--ink);transform:rotate(-1.6deg) scale(.7);opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.3,1.5,.5,1),opacity .35s;box-shadow:0 6px 16px rgba(40,20,5,.35);clip-path:polygon(0 4%,5% 0,22% 3%,40% 0,61% 3%,80% 0,100% 4%,98% 52%,100% 97%,78% 100%,55% 97%,30% 100%,8% 97%,0 100%,2% 50%);z-index:5}
#wish.show{opacity:1;transform:rotate(-1.6deg) scale(1);pointer-events:auto}
#wish h2{font:700 calc(var(--pw) * .088)/1 var(--hand);color:var(--wine)}
#wish button{margin-top:calc(var(--pw) * .03)}
/* controls */
#bar{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 10px;opacity:0;pointer-events:none;transition:opacity .4s}
#bar.on{opacity:1;pointer-events:auto;transition-delay:.7s}
#row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.btn{font:400 15px/1 var(--type);color:var(--ink);background:var(--paper);border:2px solid var(--ink);padding:9px 14px;border-radius:2px;cursor:pointer;box-shadow:2px 3px 0 rgba(59,38,22,.55);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:hover{background:#fff7e4}.btn:active,.btn.held{transform:translate(2px,3px);box-shadow:none;background:#f0cf8e}
.btn:focus-visible{outline:3px dashed var(--wine);outline-offset:2px}
.btn.wine{background:var(--wine);color:#fbeedd;border-color:#4a0d17}
#meterWrap{display:flex;align-items:center;gap:7px;font-size:13px;background:rgba(246,234,210,.9);border:2px solid var(--ink);padding:6px 9px;border-radius:2px}
#meter{position:relative;width:96px;height:10px;background:#e3d1ac;border:1.5px solid var(--ink)}
#meterFill{position:absolute;left:0;top:0;bottom:0;width:0;background:#3f8a4f}
#meterFill.hot{background:var(--wine)}
#meterTick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
#status{font-size:13px;color:#2a1708;background:rgba(246,234,210,.85);padding:3px 9px;border-radius:2px;text-align:center;max-width:94vw}
#hint{position:fixed;left:0;right:0;top:calc(50% + var(--ph) / 2 + 14px);text-align:center;font:700 26px/1 var(--hand);color:#f6ead2;text-shadow:0 1px 3px rgba(40,20,5,.7);pointer-events:none;transition:opacity .3s}
#hint.gone{opacity:0}
/* lifted letter */
#dim{position:fixed;inset:0;background:rgba(40,22,8,.35);opacity:0;pointer-events:none;transition:opacity .45s;z-index:20}
#dim.on{opacity:1;pointer-events:auto}
#lifted{position:fixed;left:0;top:0;z-index:21;display:none;transform-origin:0 0;cursor:pointer;border:0;padding:0;background:none;box-shadow:0 20px 50px rgba(30,12,0,.55),0 3px 8px rgba(30,12,0,.4);transition:transform .6s cubic-bezier(.3,.9,.3,1)}
#lifted img{width:100%;height:100%;display:block}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){#book,#flipper{transition-duration:.01s}}
</style>
</head>

var $=function(id){return document.getElementById(id)};
var book=$('book'),cover=$('cover'),candlePage=$('candlePage'),hit=$('letterHit'),lifted=$('lifted'),dim=$('dim');
var bar=$('bar'),status=$('status'),hint=$('hint'),wish=$('wish');
var isOpen=false,letterUp=false,letterBusy=false;

/* ---------- open / close ---------- */
function openBook(){
  if(isOpen)return; isOpen=true;
  book.classList.add('open'); bar.classList.add('on'); hint.classList.add('gone');
}
function closeBook(){
  if(!isOpen)return;
  if(letterUp)tuck();
  stopHold(); isOpen=false;
  book.classList.remove('open'); bar.classList.remove('on'); hint.classList.remove('gone');
}
cover.addEventListener('click',openBook);
cover.addEventListener('keydown',function(e){if(e.key==='Enter'){openBook();}});
$('back').addEventListener('click',closeBook);

/* ---------- letter lift ---------- */
var LW=1195,LH=1690;
function targetRect(){
  var pr=$('letterPage').getBoundingClientRect(), vw=innerWidth, vh=innerHeight, w,h,cx,cy;
  if(pr.width<300){ // small screens: use the viewport so the text is readable
    h=Math.min(vh*.9,vw*.94*LH/LW); cx=vw/2; cy=vh/2;
  }else{
    h=pr.height*.86; cx=pr.left+pr.width/2; cy=pr.top+pr.height/2;
  }
  w=h*LW/LH; return {left:cx-w/2,top:cy-h/2,width:w,height:h};
}
function xf(from,to){
  return 'translate('+(from.left-to.left)+'px,'+(from.top-to.top)+'px) scale('+(from.width/to.width)+','+(from.height/to.height)+')';
}
function lift(){
  if(letterUp||letterBusy)return; letterBusy=true;
  var from=hit.getBoundingClientRect(), to=targetRect();
  lifted.style.display='block';
  lifted.style.left=to.left+'px';lifted.style.top=to.top+'px';lifted.style.width=to.width+'px';lifted.style.height=to.height+'px';
  lifted.style.transition='none';lifted.style.transform=xf(from,to);lifted.style.opacity='0';
  void lifted.offsetWidth;
  lifted.style.transition='transform .65s cubic-bezier(.3,.9,.3,1),opacity .2s';
  lifted.style.opacity='1';lifted.style.transform='rotate(-.8deg)';
  dim.classList.add('on'); $('letterHint').classList.add('gone');
  setTimeout(function(){letterUp=true;letterBusy=false;},650);
}
function tuck(){
  if(!letterUp||letterBusy)return; letterBusy=true;
  var from=hit.getBoundingClientRect(), to=targetRect();
  lifted.style.transform=xf(from,to); dim.classList.remove('on');
  setTimeout(function(){lifted.style.opacity='0';},430);
  setTimeout(function(){lifted.style.display='none';letterUp=false;letterBusy=false;},650);
}
hit.addEventListener('click',lift);
lifted.addEventListener('click',tuck);
dim.addEventListener('click',tuck);
addEventListener('resize',function(){if(letterUp){lifted.style.transition='none';lifted.style.display='none';dim.classList.remove('on');letterUp=false;}});

/* ---------- flames ---------- */
var flames=FLAMES.map(function(f,i){
  var el=document.createElement('div'); el.className='flame';
  el.style.left=(f.x/14.14)+'%';el.style.top=(f.y/20)+'%';el.style.width=(f.w/14.14)+'%';el.style.height=(f.h/20)+'%';
  el.style.transformOrigin=((f.wx-f.x)/f.w*100)+'% 100%';
  var im=new Image();im.src=FLAME_SRC[i];im.alt='';el.appendChild(im);
  candlePage.insertBefore(el,wish);
  return {el:el,f:f,lit:true,size:1,lean:0,phase:i*2.1,k:[1,.85,1.12][i],outAt:0};
});
function puff(f){
  var s=document.createElement('span');s.className='smoke';
  s.style.left=(f.wx/14.14)+'%';s.style.top=(f.wy/20)+'%';
  candlePage.insertBefore(s,wish);s.addEventListener('animationend',function(){s.remove()});
}

/* ---------- blowing input ---------- */
var held=false,micOn=false,ctx=null,analyser=null,td=null,rms=0,thr=MIN_THRESHOLD,ambient=[],blowT=0,allOut=false;
var meterFill=$('meterFill'),meterTick=$('meterTick');
function setStatus(t){status.textContent=t}
function startHold(){held=true;$('holdBtn').classList.add('held')}
function stopHold(){held=false;$('holdBtn').classList.remove('held')}
var hb=$('holdBtn');
hb.addEventListener('pointerdown',function(e){e.preventDefault();hb.setPointerCapture&&hb.setPointerCapture(e.pointerId);startHold()});
['pointerup','pointercancel','lostpointercapture'].forEach(function(n){hb.addEventListener(n,stopHold)});
hb.addEventListener('keydown',function(e){if(e.code==='Space')e.preventDefault()});
document.addEventListener('keydown',function(e){
  if(e.code==='Space'&&isOpen&&!letterUp){e.preventDefault();if(!e.repeat)startHold();}
  if(e.key==='Escape'&&letterUp)tuck();
});
document.addEventListener('keyup',function(e){if(e.code==='Space')stopHold()});
addEventListener('blur',stopHold);

$('micBtn').addEventListener('click',function(){
  if(micOn)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.isSecureContext){
    setStatus('The mic only works when this card is hosted on https. Use hold to blow (or Space) for now.');return;
  }
  setStatus('Asking for the mic…');
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(stream){
    var AC=window.AudioContext||window.webkitAudioContext;
    ctx=new AC();var p=ctx.resume?ctx.resume():null;
    var src=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=0;
    src.connect(analyser);td=new Float32Array(analyser.fftSize);micOn=true;ambient=[];
    $('micBtn').textContent='mic on';$('micBtn').disabled=true;
    setStatus('Mic is on. Stay quiet for a second, then blow.');
  }).catch(function(){
    setStatus('Mic blocked. Allow it in your browser, or use hold to blow (Space).');
  });
});

/* ---------- main loop ---------- */
var last=performance.now();
function loop(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  var t=now/1000, mic=0;
  if(micOn&&analyser){
    analyser.getFloatTimeDomainData(td);var s=0;for(var i=0;i<td.length;i++)s+=td[i]*td[i];
    rms=Math.sqrt(s/td.length);
    if(ambient.length<30){ambient.push(rms);if(ambient.length===30){var m=ambient.reduce(function(a,b){return a+b},0)/30;thr=Math.max(MIN_THRESHOLD,m*3);setStatus('Ready: blow on the candles.');}}
    else if(rms>thr){mic=Math.min(1,(rms-thr*.6)/.22);}
    var lv=Math.min(1,rms/.35);meterFill.style.width=(lv*100)+'%';meterFill.classList.toggle('hot',rms>thr&&ambient.length>=30);
    meterTick.style.left=(Math.min(1,thr/.35)*100)+'%';
  }
  var intensity=held?.85:mic, blowing=intensity>0;
  var anyLit=false;
  for(var j=0;j<flames.length;j++){
    var F=flames[j];
    if(F.lit&&allOut===false)anyLit=true;
    var target=blowing?intensity:0;
    F.lean+=(target-F.lean)*Math.min(1,dt*(blowing?14:6));
    var sizeT=F.lit?1:0;F.size+=(sizeT-F.size)*Math.min(1,dt*(F.lit?7:12));
    var flick=Math.sin(t*7.3+F.phase)*(1.2+F.lean*5)+Math.sin(t*12.1+F.phase*2)*.8;
    var rot=F.lean*F.k*30+flick, sk=-F.lean*F.k*14;
    var sy=(1-F.lean*.14+Math.sin(t*9+F.phase)*.025)*F.size, sx=(1+F.lean*.05)*(.35+.65*F.size);
    F.el.style.transform='rotate('+rot+'deg) skewX('+sk+'deg) scale('+sx+','+sy+')';
    F.el.style.opacity=Math.min(1,F.size*1.6);
    if(F.lit&&F.outAt&&now>=F.outAt){F.lit=false;F.outAt=0;puff(F.f);}
  }
  // blow timer
  var litCount=flames.filter(function(F){return F.lit}).length;
  if(litCount>0&&isOpen&&!letterUp){
    if(blowing&&!flames.some(function(F){return F.outAt})){
      blowT+=dt; if(blowT>=BLOW_SECONDS){
        flames.forEach(function(F,k){if(F.lit)F.outAt=now+k*90;});
        setTimeout(showWish,520);
      }
    }else if(!blowing){blowT=Math.max(0,blowT-dt*1.5);}
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function showWish(){
  allOut=true;wish.classList.add('show');confetti();
  setStatus('Nice blow! Make a wish, '+NAME+'.');
}
$('relight').addEventListener('click',function(){
  wish.classList.remove('show');allOut=false;blowT=0;
  flames.forEach(function(F){F.lit=true;F.outAt=0;});
  stopConfetti();
  setStatus(micOn?'Ready: blow on the candles.':'Turn on your mic, then blow on the candles.');
});

/* ---------- confetti ---------- */
var cv=$('confetti'),cx=cv.getContext('2d'),parts=[],raf=0;
var COLORS=['#a82a5a','#f5c431','#2f4a8a','#e8742c','#6a9a4a','#f06292','#f6ead2','#7d4a2a'];
function sizeCanvas(){var r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0)}
addEventListener('resize',sizeCanvas);sizeCanvas();
function confetti(){
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches, n=reduce?30:150, r=candlePage.getBoundingClientRect();
  parts=[];
  for(var i=0;i<n;i++){
    var fromLeft=i%2;var ox=fromLeft?r.left+r.width*.15:r.right-r.width*.15;
    parts.push({x:ox,y:r.top+r.height*.55,vx:(fromLeft?1:-1)*(120+Math.random()*420)+(Math.random()-.5)*160,vy:-(300+Math.random()*620),
      w:6+Math.random()*7,h:4+Math.random()*8,rot:Math.random()*6.3,vr:(Math.random()-.5)*14,c:COLORS[i%COLORS.length],round:Math.random()<.25,life:2.6+Math.random()*1.6,age:0});
  }
  cancelAnimationFrame(raf);var lt=performance.now();
  (function step(now){
    var dt=Math.min(.05,(now-lt)/1000);lt=now;cx.clearRect(0,0,innerWidth,innerHeight);var alive=0;
    parts.forEach(function(p){
      p.age+=dt;if(p.age>p.life)return;alive++;
      p.vy+=900*dt;p.vx*=1-1.1*dt;p.vy*=1-.6*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
      cx.globalAlpha=Math.min(1,(p.life-p.age)*1.5);cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
      if(p.round){cx.beginPath();cx.arc(0,0,p.w/2,0,6.3);cx.fill()}else{cx.scale(1,Math.abs(Math.cos(p.rot*1.7))*.8+.2);cx.fillRect(-p.w/2,-p.h/2,p.w,p.h)}
      cx.restore();
    });
    cx.globalAlpha=1;
    if(alive)raf=requestAnimationFrame(step);else cx.clearRect(0,0,innerWidth,innerHeight);
  })(lt);
}
function stopConfetti(){cancelAnimationFrame(raf);parts=[];cx.clearRect(0,0,innerWidth,innerHeight)}
})();
</script>
